<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Nguyen Van Bao</title><link rel="stylesheet" href="/style.css"><style>.admin{max-width:620px;margin:auto;padding:24px;border:1px solid #ffffff12;border-radius:22px;background:#0d1522cc}.admin h1{font-size:25px;letter-spacing:-1px}.admin p{color:#7f899b;font-size:10px}.admin input,.admin button{width:100%;height:46px;margin-top:9px;border-radius:12px;border:1px solid #2b3851;background:#0a101c;color:#eaf0ff;padding:0 13px;font:600 10px inherit}.admin button{background:#286df3;border:0;cursor:pointer}.file-row{margin-top:10px;padding:12px;border:1px solid #ffffff10;border-radius:12px;display:flex;justify-content:space-between;color:#aeb8ca;font-size:9px}.back{display:inline-block;margin-bottom:12px;color:#73a4ff;font-size:9px}</style></head><body><main class="admin"><a class="back" href="/">← Về trang chủ</a><h1>Quản lý tệp</h1><p>Chỉ chủ web có ADMIN_KEY mới có thể upload.</p><input id="key" type="password" placeholder="ADMIN_KEY"><input id="file" type="file"><button id="upload">Upload tệp</button><div id="msg"></div><h3 style="font-size:13px;margin-top:25px">Tệp hiện có</h3><div id="list"></div></main><script>const $=s=>document.querySelector(s);async function list(){let r=await fetch('/api/files');let d=await r.json();$('#list').innerHTML=d.files.map(f=>`<div class="file-row"><span>${f.pathname.split('/').pop()}</span><a href="${f.url}" target="_blank">Mở</a></div>`).join('')||'<p>Chưa có tệp.</p>'}$('#upload').onclick=async()=>{let f=$('#file').files[0],k=$('#key').value;if(!f||!k){$('#msg').textContent='Nhập key và chọn tệp.';return}let fd=new FormData();fd.append('file',f);let r=await fetch('/api/files',{method:'POST',headers:{'x-admin-key':k},body:fd});let d=await r.json();$('#msg').textContent=d.message||d.error||'Hoàn tất';if(r.ok)list()};list()</script></body></html>
